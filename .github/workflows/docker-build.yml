name: Build Docker Image and Transfer to Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly rebuild + deploy to pick up base image / OS security fixes
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  build-and-transfer:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout repository
        uses: actions/checkout@v5

      # New step: Read version from package.json
      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Step 2: Build the Docker image
      - name: Build Docker image
        run: |
          docker build --pull -t dart-scoreboard:latest -t dart-scoreboard:${{ steps.package-version.outputs.version }} .

      # Step 3: Save the Docker image as a tar file
      - name: Save Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker save dart-scoreboard:latest dart-scoreboard:${{ steps.package-version.outputs.version }} -o /tmp/dart-scoreboard.tar
          chmod 644 /tmp/dart-scoreboard.tar
          cp /tmp/dart-scoreboard.tar .
          ls -al .

      # Step 4: Transfer the Docker image to the remote server
      - name: Transfer Docker image to server
        if: github.event_name != 'pull_request'
        uses: easingthemes/ssh-deploy@v5.1.2
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
          SOURCE: "dart-scoreboard.tar"
          TARGET: "/home/deploy/"

      # Step 5: Load the Docker image on the server
      - name: Load Docker image on server
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.2.5
        with:
          key: ${{ secrets.SERVER_SSH_KEY }}
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          script: |
            docker stop dart-scoreboard
            docker rm dart-scoreboard
            docker load -i ~/dart-scoreboard.tar
            docker run -d --name dart-scoreboard -p 5008:8080 --restart unless-stopped dart-scoreboard:${{ steps.package-version.outputs.version }}
            rm ~/dart-scoreboard.tar  # Optionally remove the tar file after loading

  # Merge Dependabot minor/patch PRs once the build above has passed, then deploy.
  dependabot-merge:
    needs: build-and-transfer
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge PR and deploy
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr merge --squash --delete-branch "$PR_URL"
          # Merges made by a workflow don't trigger the push deploy,
          # so start the deploy run on main explicitly.
          gh workflow run docker-build.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
